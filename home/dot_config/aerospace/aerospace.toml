# Omarchy's Hyprland tiling (default/hypr/bindings/tiling-v2.conf + looknfeel.conf)
# ported to AeroSpace. Modifier mapping: Hyprland SUPER -> ctrl-alt, Hyprland ALT -> cmd.
#
# ctrl-alt (not plain alt) is the leader: on a French AZERTY Mac, Option is the
# character-composition modifier (alt-5 = {, alt-shift-5 = [, alt-minus = },
# alt-shift-l = |, alt-n = ~) and Option+arrows move/select by word in every text
# field. Ctrl+Option produces no characters and is unused by macOS.
config-version = 2

start-at-login = true
auto-reload-config = true

# AZERTY: bindings are matched by key code, and the default 'qwerty' preset means
# key names follow physical QWERTY positions. Remap the letters that move so a
# binding name matches the key cap. (Only letters are remapped; AZERTY punctuation
# is shifted and no binding below uses it.)
key-mapping.key-notation-to-key-code = { a = 'q', q = 'a', z = 'w', w = 'z', m = 'semicolon' }

# looknfeel.conf: gaps_in = 5 (half-gap per window), gaps_out = 10
gaps.inner.horizontal = 10
gaps.inner.vertical = 10
gaps.outer.left = 10
gaps.outer.bottom = 10
gaps.outer.top = 10
gaps.outer.right = 10

# dwindle: new windows split the focused window, alternating orientation
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# misc { focus_on_activate = true }, cursor { warp_on_change_workspace = 1 }
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[mode.main.binding]
    # Close windows
    ctrl-alt-w = 'close'
    ctrl-cmd-forwardDelete = ['close-all-windows-but-current', 'close']

    # Control tiling
    ctrl-alt-j = 'layout tiles horizontal vertical' # togglesplit
    ctrl-alt-t = 'layout floating tiling'           # togglefloating
    ctrl-alt-f = 'fullscreen'
    ctrl-alt-shift-f = 'fullscreen --no-outer-gaps' # tiled full screen
    ctrl-alt-o = 'layout floating'                  # window pop out
    ctrl-alt-l = 'layout tiles accordion'           # toggle workspace layout

    # Move focus with SUPER + arrow keys
    ctrl-alt-left = 'focus left'
    ctrl-alt-right = 'focus right'
    ctrl-alt-up = 'focus up'
    ctrl-alt-down = 'focus down'

    # Switch workspaces with SUPER + [1-9; 0]
    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'
    ctrl-alt-6 = 'workspace 6'
    ctrl-alt-7 = 'workspace 7'
    ctrl-alt-8 = 'workspace 8'
    ctrl-alt-9 = 'workspace 9'
    ctrl-alt-0 = 'workspace 10'

    # Move active window to a workspace with SUPER + SHIFT + [1-9; 0]
    ctrl-alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    ctrl-alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    ctrl-alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    ctrl-alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    ctrl-alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    ctrl-alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    ctrl-alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    ctrl-alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    ctrl-alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    ctrl-alt-shift-0 = 'move-node-to-workspace 10 --focus-follows-window'

    # Move active window silently to a workspace with SUPER + SHIFT + ALT + [1-9; 0]
    ctrl-alt-shift-cmd-1 = 'move-node-to-workspace 1'
    ctrl-alt-shift-cmd-2 = 'move-node-to-workspace 2'
    ctrl-alt-shift-cmd-3 = 'move-node-to-workspace 3'
    ctrl-alt-shift-cmd-4 = 'move-node-to-workspace 4'
    ctrl-alt-shift-cmd-5 = 'move-node-to-workspace 5'
    ctrl-alt-shift-cmd-6 = 'move-node-to-workspace 6'
    ctrl-alt-shift-cmd-7 = 'move-node-to-workspace 7'
    ctrl-alt-shift-cmd-8 = 'move-node-to-workspace 8'
    ctrl-alt-shift-cmd-9 = 'move-node-to-workspace 9'
    ctrl-alt-shift-cmd-0 = 'move-node-to-workspace 10'

    # Scratchpad (special workspace S)
    ctrl-alt-s = 'workspace S'
    ctrl-alt-cmd-s = 'move-node-to-workspace S'

    # TAB between workspaces
    ctrl-alt-tab = 'workspace --wrap-around next'
    ctrl-alt-shift-tab = 'workspace --wrap-around prev'
    ctrl-alt-cmd-tab = 'workspace-back-and-forth'

    # Move workspaces to other monitors
    ctrl-alt-shift-cmd-left = 'move-workspace-to-monitor --wrap-around left'
    ctrl-alt-shift-cmd-right = 'move-workspace-to-monitor --wrap-around right'
    ctrl-alt-shift-cmd-up = 'move-workspace-to-monitor --wrap-around up'
    ctrl-alt-shift-cmd-down = 'move-workspace-to-monitor --wrap-around down'

    # Swap active window with the one next to it
    ctrl-alt-shift-left = 'move left'
    ctrl-alt-shift-right = 'move right'
    ctrl-alt-shift-up = 'move up'
    ctrl-alt-shift-down = 'move down'

    # Cycle through monitors
    ctrl-cmd-tab = 'focus-monitor --wrap-around next'
    ctrl-cmd-shift-tab = 'focus-monitor --wrap-around prev'

    # Groups -> accordion containers
    ctrl-alt-g = 'layout accordion tiles'
    ctrl-alt-cmd-left = 'join-with left'
    ctrl-alt-cmd-right = 'join-with right'
    ctrl-alt-cmd-up = 'join-with up'
    ctrl-alt-cmd-down = 'join-with down'
