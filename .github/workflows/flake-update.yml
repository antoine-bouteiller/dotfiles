name: Update flake.lock and packages

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 03:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Update flake.lock and packages
        env:
          NIX_PATH: nixpkgs=flake:nixpkgs
        run: nix run --impure .#update

      - name: Format
        run: nix fmt

      - name: Open auto-merging pull request
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          branch="flake-update"
          git checkout -b "$branch"
          git commit -m "chore(deps): auto-update flake.lock and packages"
          git push --force origin "$branch"
          gh pr view "$branch" --json state --jq '.state == "OPEN"' | grep -q true || \
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "chore(deps): auto-update flake.lock and packages" \
              --body "Automated weekly update of flake inputs and custom packages."
          gh pr merge "$branch" --squash --auto --delete-branch
