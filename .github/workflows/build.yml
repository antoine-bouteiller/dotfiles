name: Build hosts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Collect hosts per system
        id: hosts
        run: |
          set -e
          include='[]'
          for entry in x86_64-linux:ubuntu-latest aarch64-darwin:macos-latest; do
            system=${entry%%:*}
            runner=${entry##*:}
            hosts=$(nix eval --json ".#checks.$system" --apply 'builtins.attrNames' --no-write-lock-file)
            include=$(jq -c --argjson hosts "$hosts" --arg system "$system" --arg runner "$runner" \
              '. + [$hosts[] | {system: $system, runner: $runner, host: .}]' <<<"$include")
          done
          echo "matrix={\"include\":$include}" >>"$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.host }} (${{ matrix.system }})
    env:
      # Only main and the updater's same-repository PR may publish build outputs.
      CACHIX_PUSH: >-
        ${{ github.ref == 'refs/heads/main' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository &&
             github.head_ref == 'flake-update' && github.base_ref == 'main') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The plex-server closure outstrips the ~14GB a GitHub Ubuntu runner leaves
      # free. Must run before Nix is installed: it hands the reclaimed space to /nix.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        if: runner.os == 'Linux'
        with:
          hatchet-protocol: rampage

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: antoine-bouteiller
          extraPullNames: noctalia
          authToken: ${{ env.CACHIX_PUSH == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          # pushFilter only filters roots; automatic closure uploads bypass it.
          skipPush: true

      - name: Discover binary repackages and snapshot the store
        id: cache-inputs
        if: env.CACHIX_PUSH == 'true'
        run: |
          nix eval --json --impure --no-write-lock-file --expr '
            let
              flake = builtins.getFlake "git+file://${toString ./.}";
              lib = flake.inputs.nixpkgs.lib;
              host = "${{ matrix.host }}";
              config = (flake.nixosConfigurations.${host}
                or flake.darwinConfigurations.${host}
                or flake.homeConfigurations.${host}).config;
              homes = builtins.attrValues (config.home-manager.users or {})
                ++ lib.optional (config ? home.packages) config;
              packages = builtins.attrValues flake.packages.${{ matrix.system }}
                ++ (config.environment.systemPackages or [])
                ++ builtins.concatMap (home: home.home.packages) homes;
            in lib.unique (builtins.map lib.getName (builtins.filter
              (p: builtins.any (s: s.shortName == "binaryNativeCode")
                (p.meta.sourceProvenance or []))
              packages))
          ' > "$RUNNER_TEMP/binary-packages.json"
          nu=$(nix build --inputs-from . nixpkgs#nushell --no-link --print-out-paths --no-write-lock-file)
          echo "nu=$nu/bin/nu" >> "$GITHUB_OUTPUT"
          nix path-info --all > "$RUNNER_TEMP/store-before"

      # Nix may migrate Lix's relative-input lock format; keep the source hash stable.
      - name: Build ${{ matrix.host }}
        run: nix build ".#checks.${{ matrix.system }}.${{ matrix.host }}" --no-link --print-build-logs --no-write-lock-file

      - name: Push cacheable outputs
        if: ${{ !cancelled() && steps.cache-inputs.outcome == 'success' }}
        run: |
          # Keep successful dependencies even if a later host build failed.
          "${{ steps.cache-inputs.outputs.nu }}" --no-config-file .github/cachix-paths.nu \
            "$RUNNER_TEMP/store-before" "$RUNNER_TEMP/binary-packages.json" \
            > "$RUNNER_TEMP/cachix-paths"
          if [ -s "$RUNNER_TEMP/cachix-paths" ]; then
            cachix push antoine-bouteiller < "$RUNNER_TEMP/cachix-paths"
          fi
