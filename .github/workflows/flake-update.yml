name: Update flake locks

on:
  schedule:
    - cron: "23 4 * * 0" # Every Sunday at 04:23 UTC; off the hour, GitHub drops top-of-hour runs
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Refresh Caddy plugin hash
        env:
          NIX_PATH: nixpkgs=flake:nixpkgs
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: nix run --impure .#update --no-write-lock-file -- caddy-cloudflare

      - name: Verify Caddy build
        run: nix build .#caddy-cloudflare --no-link --print-build-logs --no-write-lock-file

      - name: Update dev flake.lock
        run: nix flake update --flake ./dev

      - name: Format
        run: nix run ./dev

      - name: Open auto-merging pull request
        env:
          GH_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          title="chore(deps): update flake locks"
          body="Automated weekly update of both flake locks."
          if ! git diff --cached --quiet -- pkgs/caddy-cloudflare; then
            title="$title and Caddy plugin hash"
            body="Automated weekly update of both flake locks and the Caddy plugin hash, verified against the updated nixpkgs."
          fi
          branch="update/flake"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "$title"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state --jq '.state == "OPEN"' | grep -q true; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "$title" --body "$body"
          fi
          gh pr merge "$branch" --rebase --auto --delete-branch
