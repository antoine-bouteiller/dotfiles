name: Check Pi extensions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pi-extensions.yml"
      - "home-manager/applications/agents/pi/extensions/**"
      - "home-manager/applications/agents/pi/tsconfig.json"
  pull_request:
    paths:
      - ".github/workflows/pi-extensions.yml"
      - "home-manager/applications/agents/pi/extensions/**"
      - "home-manager/applications/agents/pi/tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-extensions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: home-manager/applications/agents/pi/extensions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: home-manager/applications/agents/pi/extensions/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check extensions
        run: bun run check
